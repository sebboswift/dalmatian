{{- if .Values.spark.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dalmatian.fullname" . }}-spark-master
  labels:
    {{- include "dalmatian.labels" . | nindent 4 }}
    app.kubernetes.io/component: spark-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dalmatian.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: spark-master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dalmatian.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: spark-master
    spec:
      serviceAccountName: {{ include "dalmatian.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.spark.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.spark.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.spark.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: spark-master
          image: {{ .Values.spark.image | quote }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: SPARK_LOCAL_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.master.Master
            - --host
            - "$(SPARK_LOCAL_IP)"
            - --port
            - "7077"
            - --webui-port
            - "8080"
          ports:
            - name: spark
              containerPort: 7077
            - name: ui
              containerPort: 8080
          resources:
            {{- toYaml .Values.spark.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dalmatian.fullname" . }}-spark-master
  labels:
    {{- include "dalmatian.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "dalmatian.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: spark-master
  ports:
    - name: spark
      port: 7077
      targetPort: spark
    - name: ui
      port: 8080
      targetPort: ui
{{- end }}
