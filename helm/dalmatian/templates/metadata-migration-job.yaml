{{- if .Values.metadataMigrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dalmatian.fullname" . }}-metadata-migrate
  labels:
    {{- include "dalmatian.labels" . | nindent 4 }}
    app.kubernetes.io/component: metadata-migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.metadataMigrations.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dalmatian.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: metadata-migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "dalmatian.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["dalmatian-admin", "metadata-upgrade"]
          env:
            {{- if .Values.config.metadataUrlSecret.name }}
            - name: DALMATIAN_METADATA_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.metadataUrlSecret.name | quote }}
                  key: {{ .Values.config.metadataUrlSecret.key | quote }}
            {{- else if .Values.config.metadataUrl }}
            - name: DALMATIAN_METADATA_URL
              value: {{ .Values.config.metadataUrl | quote }}
            {{- end }}
            {{- with .Values.metadataMigrations.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
{{- end }}
