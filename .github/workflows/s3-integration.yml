name: s3-integration

on:
  workflow_dispatch:

jobs:
  minio:
    runs-on: ubuntu-latest
    env:
      DALMATIAN_TEST_S3_ROOT: s3a://dalmatian
      DALMATIAN_TEST_S3_ENDPOINT: http://localhost:9000
      DALMATIAN_TEST_S3_ACCESS_KEY: dalmatian
      DALMATIAN_TEST_S3_SECRET_KEY: dalmatian-secret
      DALMATIAN_TEST_SPARK_PACKAGES: org.apache.hadoop:hadoop-aws:3.5.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: docker compose --profile s3 up -d minio minio-init
      - run: pip install poetry
      - run: poetry install
      - run: poetry run pytest -m integration tests/integration/test_s3_store.py
      - if: always()
        run: docker compose --profile s3 logs minio minio-init
